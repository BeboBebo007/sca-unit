<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCA-Unit Structural Assessment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #17202a;
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 24px;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .documents {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #c7ced6;
      border-radius: 8px;
      font-family: monospace;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      margin-top: 22px;
      padding: 18px;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
      overflow: auto;
      min-height: 90px;
    }

    @media (max-width: 760px) {
      .documents {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>SCA-Unit</h1>
      <p>Compare two JSON documents and inspect their structural drift.</p>

      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off">

      <div class="documents">
        <div>
          <label for="first-document">Baseline JSON</label>
          <textarea id="first-document">{
  "user": {
    "name": "Ada"
  }
}</textarea>
        </div>

        <div>
          <label for="second-document">Current JSON</label>
          <textarea id="second-document">{
  "user": {
    "name": "Ada",
    "roles": ["admin"]
  }
}</textarea>
        </div>
      </div>

      <button id="compare-button" type="button">Compare structures</button>

      <pre id="result">Ready for assessment.</pre>
    </div>
  </main>

  <script>
    const button = document.getElementById("compare-button");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      result.textContent = "Assessing...";

      try {
        const firstDocument = JSON.parse(
          document.getElementById("first-document").value
        );
        const secondDocument = JSON.parse(
          document.getElementById("second-document").value
        );

        const response = await fetch("/assess-json", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": document.getElementById("api-key").value
          },
          body: JSON.stringify({
            first_document: firstDocument,
            second_document: secondDocument,
            first_identity: "baseline-json",
            second_identity: "current-json"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Assessment failed");
        }

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
