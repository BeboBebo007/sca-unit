[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sca-unit"
version = "0.3.0"
description = "Structural compatibility assessment prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bassam Alkarishy" }
]
dependencies = []

[project.scripts]
sca-unit = "sca_unit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tests_private"]
